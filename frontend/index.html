<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563d8">
<title>Хмарна полиця</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header class="bar" id="header"></header>
<main id="main"></main>
<footer id="footer"></footer>
<dialog id="confirm-modal" class="dlg">
  <form method="dialog" onsubmit="return false">
    <h2 id="confirm-title">Підтвердження дії</h2>
    <p class="muted" id="confirm-text">Ви впевнені, що хочете продовжити?</p>
    <div class="modal-actions">
      <button type="button" class="btn danger" id="confirm-yes">Підтвердити</button>
      <button type="button" class="btn ghost" data-close>Скасувати</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
